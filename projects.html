<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Projects</title>
</head>
<body>
    <header>
        <h1>Our Projects</h1>
    </header>
    <main>
        <section class="image-slider">
            <!-- Image Slider Logic Here -->
            <div class="slides">
                <div class="slide active">
                    <img src="image1.jpg" alt="Project 1">
                    <div class="project-description">
                        <h2>Project 1</h2>
                        <p>Toggle this descriptive text of Project 1.</p>
                    </div>
                </div>
                <div class="slide">
                    <img src="image2.jpg" alt="Project 2">
                    <div class="project-description">
                        <h2>Project 2</h2>
                        <p>Toggle this descriptive text of Project 2.</p>
                    </div>
                </div>
                <!-- Add more slides as required -->
            </div>
            <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
            <button class="next" onclick="changeSlide(1)">&#10095;</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 arkenflaxen</p>
    </footer>
    <script src="slider.js"></script>
</body>
</html>
