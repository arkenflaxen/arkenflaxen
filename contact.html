<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <title>Filip Arkemar – Contact</title>
        <link rel="stylesheet" href="styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>

    <body>
        <header>
            <nav class="nav-inner">
                <a href="index.html" class="nav-brand">FA</a>
                <ul class="nav-links">
                    <li>
                        <h2><a href="about.html">About</a></h2>
                    </li>
                    <li>
                        <h2><a href="projects.html">Projects</a></h2>
                    </li>
                    <li>
                        <h2><a href="contact.html">>Contact</a></h2>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="page">
                <div class="contact-layout">
                    <div class="contact-image">
                        <img
                            src="images/filip_uden_briller.jpg"
                            alt="Profilbild"
                            class="image"
                        />
                    </div>

                    <div class="contact-info">
                        <h2>Kontakta mig</h2>
                        <p>
                            Email:
                            <a href="mailto:filip.arkemar@gmail.com">
                                filip.arkemar@gmail.com
                            </a>
                        </p>
                        <p>Telefon: +46 (0)76 795 88 11</p>
                        <p>
                            LinkedIn:
                            <a
                                href="https://www.linkedin.com/in/filip-arkemar/"
                                target="_blank"
                            >
                                linkedin.com/in/filip-arkemar
                            </a>
                        </p>
                    </div>

                    <form
                        id="contact-form"
                        class="contact-form"
                        action="https://formsubmit.co/filip.arkemar@gmail.com"
                        method="POST"
                        novalidate
                    >
                        <input
                            type="hidden"
                            name="_subject"
                            value="Nytt meddelande från portfolio"
                        />
                        <input type="hidden" name="_captcha" value="false" />

                        <div>
                            <label for="name">Namn</label><br />
                            <input type="text" id="name" name="name" />
                            <div class="form-error" data-for="name"></div>
                        </div>

                        <div>
                            <label for="email">Email</label><br />
                            <input type="email" id="email" name="email" />
                            <div class="form-error" data-for="email"></div>
                        </div>

                        <div>
                            <label for="message">Meddelande</label><br />
                            <textarea
                                id="message"
                                name="message"
                                rows="5"
                            ></textarea>
                            <div class="form-error" data-for="message"></div>
                        </div>

                        <button type="submit">Skicka</button>
                        <div id="form-status"></div>
                    </form>
                </div>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
