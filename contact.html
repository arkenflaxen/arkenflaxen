<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8" />
        <title>Filip Arkemar – Contact</title>
        <link rel="stylesheet" href="styles.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>

    <body>
        <header>
            <nav class="nav-inner">
                <a href="index.html" class="nav-brand">Filip Arkemar</a>
                <ul class="nav-links">
                    <li>
                        <h2><a href="about.html">About</a></h2>
                    </li>
                    <li>
                        <h2><a href="projects.html">Projects</a></h2>
                    </li>
                    <li>
                        <h2><a href="contact.html">>Contact</a></h2>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="page">
                <div class="contact-info">
                    <p>
                        Email:
                        <a href="mailto:filip.arkemar@example.com">
                            filip.arkemar@example.com
                        </a>
                    </p>
                    <p>Telefon: +46 (0)7X XXX XX XX</p>
                    <p>
                        LinkedIn:
                        <a
                            href="https://www.linkedin.com/in/filiparkemar"
                            target="_blank"
                        >
                            linkedin.com/in/filiparkemar
                        </a>
                    </p>
                </div>

                <form id="contact-form" novalidate>
                    <div>
                        <label for="name">Namn</label><br />
                        <input type="text" id="name" name="name" />
                        <div class="form-error" data-for="name"></div>
                    </div>

                    <div>
                        <label for="email">Email</label><br />
                        <input type="email" id="email" name="email" />
                        <div class="form-error" data-for="email"></div>
                    </div>

                    <div>
                        <label for="message">Meddelande</label><br />
                        <textarea
                            id="message"
                            name="message"
                            rows="5"
                        ></textarea>
                        <div class="form-error" data-for="message"></div>
                    </div>

                    <button type="submit">Skicka</button>
                    <div id="form-status"></div>
                </form>
            </section>
        </main>

        <script src="script.js"></script>
    </body>
</html>
